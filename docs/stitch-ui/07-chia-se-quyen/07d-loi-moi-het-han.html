<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lời mời đã hết hạn</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            app: {
              bg: "#0E0E10",
              surface: "#1A1A1D",
              muted: "#8E8E93",
              accent: "#F26A3D"
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #0E0E10;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#0E0E10] text-white antialiased min-h-screen flex items-center justify-center m-0 p-0 overflow-x-hidden">
<!-- Mobile Screen Frame (390x844 standard iOS ratio full-bleed) -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#0E0E10] flex flex-col justify-between overflow-hidden shadow-2xl">
<!-- 1. iOS Status Bar -->
<header class="w-full pt-3 px-7 flex items-center justify-between text-white text-[15px] font-semibold tracking-tight z-30 select-none">
<span class="tracking-tight text-[15px] font-semibold">9:41</span>
<div class="flex items-center gap-1.5 text-white">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 11">
<rect height="3" rx="0.5" width="3" x="0" y="8"></rect>
<rect height="5.5" rx="0.5" width="3" x="4.5" y="5.5"></rect>
<rect height="8" rx="0.5" width="3" x="9" y="3"></rect>
<rect height="11" rx="0.5" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8c2.4 0 4.6.9 6.2 2.5l1.4-1.4C13.6 1.9 10.9.8 8 .8S2.4 1.9.4 3.9L1.8 5.3C3.4 3.7 5.6 2.8 8 2.8zm0 4.2c1.3 0 2.5.5 3.4 1.4l1.4-1.4C11.6 5.8 9.9 5 8 5s-3.6.8-4.8 2l1.4 1.4C5.5 7.5 6.7 7 8 7zm0 4.2c.8 0 1.5-.7 1.5-1.5s-.7-1.5-1.5-1.5-1.5.7-1.5 1.5.7 1.5 1.5 1.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="relative w-[22px] h-[11px] border border-white/90 rounded-[3px] p-[1px] flex items-center">
<div class="h-full w-full bg-white rounded-[1.5px]"></div>
<div class="absolute -right-[3px] top-[2.5px] w-[2px] h-[4px] bg-white/90 rounded-r-[1px]"></div>
</div>
</div>
</header>
<!-- 2. TopAppBar (Shared Component Implementation) -->
<div class="flex justify-between items-center w-full px-4 pt-4 pb-2 z-20">
<button aria-label="Đóng" class="w-10 h-10 rounded-full bg-[#1A1A1D] flex items-center justify-center text-white/80 active:scale-95 hover:opacity-80 transition-all duration-150" type="button">
<span class="material-symbols-outlined text-[20px] text-white leading-none">close</span>
</button>
<div class="w-10 h-10"></div>
</div>
<!-- 3. Central Content Section -->
<main class="flex-1 flex flex-col items-center justify-center px-8 text-center -mt-10 select-none">
<!-- Icon Wrapper -->
<div class="w-24 h-24 rounded-full bg-[#1A1A1D] flex items-center justify-center mb-7">
<span class="material-symbols-outlined text-[42px] text-white/60 select-none" style="font-variation-settings: 'FILL' 0, 'wght' 200;">hourglass_empty</span>
</div>
<!-- Main Headline -->
<h1 class="text-2xl font-bold font-headline text-white tracking-tight leading-snug mb-2.5">
        Lời mời đã hết hạn
      </h1>
<!-- Secondary Subtitle -->
<p class="text-[15px] font-body text-[#8E8E93] leading-relaxed max-w-[260px]">
        Hãy nhờ người mời gửi lại liên kết mới.
      </p>
</main>
<!-- 4. Bottom Action Area & iOS Home Indicator -->
<footer class="w-full px-6 pb-2 z-20 flex flex-col items-center">
<!-- Primary Pill Button -->
<button class="w-full py-4 bg-white text-black font-semibold text-[16px] rounded-full active:scale-[0.98] transition-transform duration-150 shadow-sm flex items-center justify-center" type="button">
        Về trang chính
      </button>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center pt-5 pb-2">
<div class="w-36 h-1 bg-white/30 rounded-full"></div>
</div>
</footer>
</div>
</body></html>
