<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chia sẻ địa điểm</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Inter Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {},
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        },
      }
    }
  </script>
<style>
    body {
      background-color: #050506;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
    .material-symbols-outlined.fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-white">
<!-- iPhone Canvas Shell (390px x 844px) -->
<div class="relative w-[390px] h-[844px] bg-[#0E0E10] overflow-hidden flex flex-col justify-between shadow-2xl sm:rounded-[48px] border border-white/5">
<!-- iOS Status Bar -->
<div class="w-full h-11 pt-3 px-8 flex justify-between items-center text-white text-sm font-semibold select-none z-30 shrink-0">
<span class="tracking-tight text-[15px]">9:41</span>
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[20px] leading-none" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- Sheet Container (Large Modal Sheet) -->
<div class="flex-1 flex flex-col justify-between overflow-hidden bg-[#0E0E10] pt-1 pb-2">
<!-- Drag Handle & Top Area -->
<div class="w-full flex flex-col items-center shrink-0">
<div class="w-10 h-1 bg-[#3A3A3C] rounded-full mb-1"></div>
<!-- TopAppBar Shared Component -->
<header class="w-full rounded-t-lg pt-3 pb-2 border-none w-full flex items-center justify-between px-5">
<button class="w-9 h-9 rounded-full bg-[#1A1A1D] flex items-center justify-center text-white hover:opacity-80 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
<h1 class="text-xl font-headline font-bold text-white tracking-tight">Chia sẻ địa điểm</h1>
<button class="w-9 h-9 rounded-full bg-[#1A1A1D] flex items-center justify-center text-neutral-400 hover:opacity-80 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="more_horiz">more_horiz</span>
</button>
</header>
</div>
<!-- Main Sheet Content -->
<div class="flex-1 px-5 pt-3 pb-2 flex flex-col space-y-4 overflow-y-auto">
<!-- Place Preview Card -->
<div class="bg-[#1A1A1D] p-3 rounded-[24px] flex items-center space-x-3.5 border border-white/[0.04]">
<img alt="" class="w-[58px] h-[58px] rounded-[16px] object-cover shrink-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOBA0Op4P4nKAo3y-tYFZsdrnuZTDZFc4xci4EJxOCq4EeKfY75cu_RQ8l944322QU_myEHjMWFlhH1cvXVH_41qlLUC6o3ZzSTkNcz9iTpcwv3kEveiYO5-5_HTHm_1wQod-DDwGri9KcKBVBtQfxKhudvrkm34BSzYiCsz6K-cKd0aRkmg7rvswDYVJmrz0WqeVQo4l8GmAr9XPgYN4iSlwRJ9qtItwPXeZUFZM5f1TXzm0-dFI-50XcLgkKJKJikl8TpG--eb3a"/>
<div class="flex items-center space-x-2 min-w-0">
<span class="text-[17px] font-bold text-white truncate tracking-tight">Cà phê Giảng</span>
<span class="w-2 h-2 rounded-full bg-[#B8825A] shrink-0" title="Cà phê"></span>
</div>
</div>
<!-- Section: Quyền (Permissions) -->
<div class="space-y-2">
<div class="text-[13px] font-medium text-[#8E8E93] px-1">Quyền</div>
<div class="space-y-2">
<!-- Option 1: Người xem (Selected) -->
<div class="w-full p-4 rounded-[22px] bg-[#1A1A1D] border-2 border-[#F26A3D] flex items-center justify-between cursor-pointer transition-all active:scale-[0.99]">
<span class="text-[15px] font-semibold text-white">Người xem – Chỉ xem</span>
<div class="w-5 h-5 rounded-full border-2 border-[#F26A3D] flex items-center justify-center shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-[#F26A3D]"></div>
</div>
</div>
<!-- Option 2: Biên tập (Unselected) -->
<div class="w-full p-4 rounded-[22px] bg-[#1A1A1D] border border-white/[0.04] flex items-center justify-between cursor-pointer opacity-80 hover:opacity-100 transition-all active:scale-[0.99]">
<span class="text-[15px] font-medium text-[#8E8E93]">Biên tập – Thêm kỷ niệm</span>
<div class="w-5 h-5 rounded-full border-2 border-[#8E8E93]/40 shrink-0"></div>
</div>
</div>
</div>
<!-- Email Input Pill -->
<div class="w-full h-[52px] bg-[#1A1A1D] rounded-full px-4 flex items-center space-x-3 border border-white/[0.06]">
<span class="material-symbols-outlined text-[#8E8E93] text-[20px]" data-icon="mail">mail</span>
<input class="bg-transparent text-white placeholder-[#8E8E93] text-[15px] w-full focus:outline-none border-none p-0 focus:ring-0 font-normal" placeholder="Email (tùy chọn)" type="email"/>
</div>
<!-- Section: Hết hạn sau (Expiration Chips) -->
<div class="space-y-2">
<div class="text-[13px] font-medium text-[#8E8E93] px-1">Hết hạn sau</div>
<div class="grid grid-cols-3 gap-2">
<!-- Chip 1: 1 ngày -->
<button class="h-10 rounded-full bg-[#1A1A1D] text-[#8E8E93] text-[14px] font-medium flex items-center justify-center transition-all hover:opacity-90 active:scale-95 border border-white/[0.04]" type="button">
              1 ngày
            </button>
<!-- Chip 2: 7 ngày (Selected) -->
<button class="h-10 rounded-full bg-white text-black text-[14px] font-bold flex items-center justify-center transition-all active:scale-95 shadow-sm" type="button">
              7 ngày
            </button>
<!-- Chip 3: 30 ngày -->
<button class="h-10 rounded-full bg-[#1A1A1D] text-[#8E8E93] text-[14px] font-medium flex items-center justify-center transition-all hover:opacity-90 active:scale-95 border border-white/[0.04]" type="button">
              30 ngày
            </button>
</div>
</div>
<!-- Privacy & Content Info Card -->
<div class="bg-[#1A1A1D] p-3.5 rounded-[20px] flex items-start space-x-3 border border-white/[0.04]">
<span class="material-symbols-outlined text-[#8E8E93] text-[18px] mt-0.5 shrink-0" data-icon="lock">lock</span>
<p class="text-[13px] text-[#8E8E93] leading-relaxed">
            Được chia sẻ: tên, danh mục, địa chỉ, kỷ niệm của địa điểm. Không chia sẻ: lịch sử lần ghé.
          </p>
</div>
</div>
<!-- Bottom Primary Action & Home Indicator -->
<div class="px-5 pt-2 pb-1 shrink-0 flex flex-col items-center">
<!-- Coral Pill Button -->
<button class="w-full h-[54px] bg-[#F26A3D] text-white font-bold text-[16px] rounded-full flex items-center justify-center space-x-2 shadow-lg shadow-[#F26A3D]/20 active:scale-[0.98] transition-all hover:opacity-95" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="link">link</span>
<span>Tạo liên kết mời</span>
</button>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-white/30 rounded-full mt-5 mb-1"></div>
</div>
</div>
</div>
</body></html>
