<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Nhận lời mời - MyPlaces</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {},
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0E0E10;
      color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
  </style>
</head>
<body class="bg-[#0E0E10] text-white antialiased flex justify-center items-center min-h-screen select-none">
<!-- Mobile Canvas Frame 390x844 -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#0E0E10] flex flex-col justify-between overflow-hidden shadow-2xl">
<!-- Top Bar: Status Bar + Close Button -->
<div class="pt-3 px-6 pb-2 z-20 flex flex-col">
<!-- iOS Status Bar -->
<div class="w-full flex items-center justify-between text-white text-sm font-semibold tracking-tight h-11 select-none">
<span class="text-[15px] font-semibold pl-1">9:41</span>
<div class="flex items-center space-x-1.5 pr-1">
<!-- Cellular -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 18 12">
<rect height="4" rx="0.8" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.8" width="2.5" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.8" width="2.5" x="9" y="3"></rect>
<rect height="12" rx="0.8" width="2.5" x="13.5" y="0"></rect>
</svg>
<!-- Wifi -->
<svg class="w-4 h-3 fill-current ml-0.5" viewbox="0 0 16 12">
<path d="M8 12a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm-4.9-3.5a6.9 6.9 0 019.8 0 .8.8 0 101.1-1.1 8.5 8.5 0 00-12 0 .8.8 0 001.1 1.1zm-2.8-2.8a10.9 10.9 0 0115.4 0 .8.8 0 101.1-1.1 12.5 12.5 0 00-17.6 0 .8.8 0 101.1 1.1z"></path>
</svg>
<!-- Battery -->
<div class="w-6 h-3 border border-white/80 rounded-[4px] p-0.5 flex items-center relative ml-0.5">
<div class="h-full bg-white rounded-[2px] w-[80%]"></div>
<div class="absolute -right-1 top-1 w-0.5 h-1 bg-white/80 rounded-r-sm"></div>
</div>
</div>
</div>
<!-- Dismiss Button (Sub-page close control) -->
<div class="flex items-center justify-between mt-1">
<button aria-label="Đóng" class="w-9 h-9 rounded-full bg-[#1A1A1D] flex items-center justify-center text-white/80 hover:text-white active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
<span class="text-xs font-medium text-[#8E8E93] tracking-wide">Lời mời tham gia</span>
<div class="w-9 h-9"></div>
</div>
</div>
<!-- Center Card: Focused Locket-style Invitation Container -->
<div class="px-5 w-full my-auto flex flex-col items-center">
<div class="w-full bg-[#1A1A1D] rounded-[32px] overflow-hidden flex flex-col border border-white/5 shadow-2xl transition-all">
<!-- Cover Photo Viewport -->
<div class="relative w-full h-[270px] overflow-hidden bg-[#0E0E10]">
<img alt="Đà Lạt sương sớm" class="w-full h-full object-cover select-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAqOx3hbHQaNBhzexNQYqMNuXgtpNvEiMnOFSurjhHgJrv7rFclW9XPrIP1IY28gLYlYjX8rDv-IN_NIQMy56R43u-Ys3-sViIv00NDkAC7p8Sbmnq1ldc2hqKy_pWYxU9nR61hw5kP7YcR2onbTXW-AmaTa2JfpVdumjcqmMiwNa7uYq4JWHOvYt7ba221lnz1o18w6n1xqKQJQEVHYs7E7QARi4o3ZD1O3ijySB8_hWX9NhAl4tXTsyuRODq2i5k7yEwInb5Iy9V"/>
<!-- Subtle inner gradient for seamless depth -->
<div class="absolute inset-0 bg-gradient-to-t from-[#1A1A1D] via-transparent to-black/20"></div>
<!-- Category Pill Tag (Du lịch: #4DB6E6) -->
<!-- Two-person shared indicator badge -->
</div>
<!-- Invitation Context Info Body -->
<div class="p-6 pt-5 flex flex-col">
<!-- Inviter row -->
<div class="flex items-center gap-2.5">
<img class="w-7 h-7 rounded-full object-cover ring-1 ring-white/10" data-alt="Close-up portrait of a youthful Vietnamese girl named Linh smiling softly with gentle warm natural rim lighting, clean dark aesthetic background, minimal modern lifestyle photography." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFVZRCswwuVJ48D5O9piDz6Bja46fGyvyH0h-Gj3xUoC5uHY3rm6BNoddssBfYPy33ZxGZjACiGhPh-gDwpoC8dE2vOOpwYSalYbgohAbaAO32rDOwKZEqHL0lQX44lMKCFPf18I7MaN64TrenlP_w-0JS3Mq1ruSKyE4lLDN-wl9zYfIfTwpGfZxAseliZ6mW5GdnY_jVP5pEYzNlnnsMzzg_HPmUVz-STcCvqwUQn6JK7VSHSvBFuVDLA5vqu-nDDTMz4WwUZVg8"/>
<p class="text-sm text-[#8E8E93] font-medium tracking-tight">
<span class="text-white font-semibold">Linh Trần</span> mời bạn vào nhật ký
            </p>
</div>
<!-- Primary Title -->
<h1 class="text-[28px] font-bold text-white tracking-tight leading-tight mt-3">
            Đà Lạt cùng nhóm
          </h1>
<!-- Role Pill & Context Meta -->
<div class="flex items-center gap-2 mt-3">
<span class="inline-flex items-center gap-1.5 bg-[#26262B] text-neutral-200 text-xs px-3 py-1 rounded-full font-medium border border-white/5">
<span class="material-symbols-outlined text-[13px] text-white/70" data-icon="edit">edit</span>
              Quyền: Biên tập
            </span>
</div>
<!-- Capability Description -->
<p class="text-sm text-[#8E8E93] font-normal mt-3 leading-relaxed">
            Bạn có thể xem và thêm kỷ niệm.
          </p>
</div>
</div>
</div>
<!-- Bottom Action Section (Full-width Pill Button + Decline Text) -->
<div class="w-full px-6 pb-2 pt-2 flex flex-col items-center z-10">
<!-- Primary Accept Pill Button -->
<button class="w-full h-14 bg-[#F26A3D] active:bg-[#e05e32] text-white font-semibold text-base rounded-full flex items-center justify-center shadow-lg active:scale-[0.98] transition-all">
        Chấp nhận
      </button>
<!-- Secondary Decline Button -->
<button class="w-full py-3.5 text-center text-[#8E8E93] hover:text-white active:scale-95 text-sm font-medium transition-colors">
        Từ chối
      </button>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center pt-2 pb-1">
<div class="w-32 h-1 bg-white/30 rounded-full"></div>
</div>
</div>
</div>
</body></html>
