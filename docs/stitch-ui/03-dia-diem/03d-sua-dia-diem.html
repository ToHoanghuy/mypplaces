<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Sửa địa điểm - MyPlaces</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            bgDark: "#0E0E10",
            surfaceDark: "#1A1A1D",
            textSecondary: "#8E8E93",
            coralAccent: "#F26A3D",
            dangerRed: "#FF453A",
            catAmThuc: "#F26A3D",
            catCaPhe: "#B8825A",
            catDuLich: "#4DB6E6",
            catKhachSan: "#9B87E8",
            catMuaSam: "#F06FA3",
            catGiaiTri: "#F5C04A",
            catKhac: "#8E98A3"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    /* Custom subtle scrollbar hiding */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Touch optimizations */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#0E0E10] text-white font-body antialiased min-h-screen flex items-center justify-center p-0 md:py-6 selection:bg-[#F26A3D]/30">
<!-- iOS Device Wrapper (390 x 844 target canvas) -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#0E0E10] overflow-hidden md:rounded-[48px] md:shadow-[0_25px_60px_-15px_rgba(0,0,0,0.9)] md:border md:border-white/5 flex flex-col justify-between">
<!-- Top Area: Status Bar & Modal Navbar -->
<header class="w-full shrink-0 z-30 pt-3 px-6 pb-2">
<!-- iOS Status Bar -->
<div class="flex justify-between items-center text-xs font-semibold tracking-tight text-white mb-3">
<span class="pl-2 tracking-normal text-sm font-semibold">9:41</span>
<div class="flex items-center space-x-1.5 pr-1">
<!-- Signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.5" width="2.5" x="9" y="3"></rect>
<rect height="11.5" rx="0.5" width="2.5" x="13.5" y="0.5"></rect>
</svg>
<!-- Wifi -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8C5.2 2.8 2.7 3.9 0.8 5.7L0 4.8C2.2 2.8 5 1.5 8 1.5C11 1.5 13.8 2.8 16 4.8L15.2 5.7C13.3 3.9 10.8 2.8 8 2.8ZM8 6.5C6.3 6.5 4.7 7.2 3.5 8.4L2.7 7.5C4.1 6.1 6 5.3 8 5.3C10 5.3 11.9 6.1 13.3 7.5L12.5 8.4C11.3 7.2 9.7 6.5 8 6.5ZM8 10.2C7.2 10.2 6.5 10.8 6.5 11.6C6.5 12 6.7 12.3 6.9 12.6C7.2 12.9 7.6 13 8 13C8.4 13 8.8 12.9 9.1 12.6C9.3 12.3 9.5 12 9.5 11.6C9.5 10.8 8.8 10.2 8 10.2Z"></path>
</svg>
<!-- Battery -->
<div class="w-6 h-3 rounded-full border border-white/80 p-0.5 flex items-center">
<div class="h-full w-4 bg-white rounded-full"></div>
</div>
</div>
</div>
<!-- Navigation Bar (Modal Header) -->
<nav class="flex items-center justify-between py-1">
<button class="text-[#8E8E93] hover:text-white text-[15px] font-normal transition-colors active:scale-95 duration-150" type="button">
          Hủy
        </button>
<h1 class="text-[17px] font-semibold text-white tracking-tight">
          Sửa địa điểm
        </h1>
<button class="bg-[#F26A3D] text-white text-[14px] font-semibold px-4 py-1.5 rounded-full hover:brightness-110 active:scale-95 transition-all shadow-sm" type="button">
          Lưu
        </button>
</nav>
</header>
<!-- Main Content Form (Scrollable Area) -->
<main class="flex-1 overflow-y-auto no-scrollbar px-5 pt-1 pb-4 flex flex-col justify-between">
<div class="space-y-4">
<!-- Dark Minimal Map Card -->
<div class="relative w-full aspect-[16/9] rounded-[24px] overflow-hidden bg-[#1A1A1D] border border-white/5 shadow-inner group">
<!-- Abstract Dark Map Canvas -->
<div class="absolute inset-0 bg-[#121214]">
<!-- Subtle Dark Map Geometry Lines -->
<svg class="w-full h-full opacity-35" preserveaspectratio="none" viewbox="0 0 350 200">
<path d="M -20,60 Q 90,80 180,30 T 380,90" fill="none" stroke="#2D2D33" stroke-linecap="round" stroke-width="8"></path>
<path d="M 60,-20 L 110,220" fill="none" stroke="#25252A" stroke-width="12"></path>
<path d="M 230,-10 L 190,220" fill="none" stroke="#25252A" stroke-width="14"></path>
<path d="M -10,140 Q 140,110 360,160" fill="none" stroke="#2D2D33" stroke-width="6"></path>
<path d="M 120,40 Q 200,90 280,60" fill="none" stroke="#1E1E22" stroke-width="10"></path>
</svg>
<!-- Vignette shadow over map -->
<div class="absolute inset-0 bg-gradient-to-t from-[#0E0E10]/80 via-transparent to-black/20"></div>
</div>
<!-- Pulsing Map Pin (Coral Accent) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative flex items-center justify-center">
<div class="absolute w-10 h-10 rounded-full bg-[#F26A3D]/25 animate-ping duration-1000"></div>
<div class="absolute w-7 h-7 rounded-full bg-[#F26A3D]/40 blur-[2px]"></div>
<div class="relative z-10 w-4 h-4 bg-[#F26A3D] rounded-full border-2 border-white shadow-lg flex items-center justify-center">
<div class="w-1.5 h-1.5 bg-white rounded-full"></div>
</div>
</div>
</div>
<!-- Floating Button: 'Đổi vị trí' -->
<div class="absolute bottom-3 right-3 z-10">
<button class="flex items-center space-x-1.5 bg-[#1A1A1D]/85 backdrop-blur-md border border-white/10 px-3.5 py-1.5 rounded-full text-xs font-medium text-white shadow-lg active:scale-95 transition-all hover:bg-[#1A1A1D]" type="button">
<span class="material-symbols-outlined text-[16px] text-[#F26A3D]">pin_drop</span>
<span>Đổi vị trí</span>
</button>
</div>
</div>
<!-- Field: Tên địa điểm -->
<div class="space-y-1.5">
<label class="block text-xs font-medium text-[#8E8E93] pl-3">Tên địa điểm</label>
<div class="bg-[#1A1A1D] rounded-[22px] px-4 py-3.5 border border-white/5 focus-within:border-white/20 transition-colors">
<input class="w-full bg-transparent border-0 p-0 text-[16px] font-medium text-white focus:ring-0 focus:outline-none placeholder-[#8E8E93]" placeholder="Nhập tên địa điểm" type="text" value="Cà phê Giảng"/>
</div>
</div>
<!-- Field: Danh mục (Single Select Pill Chips) -->
<div class="space-y-2 pt-0.5">
<label class="block text-xs font-medium text-[#8E8E93] pl-3">Danh mục</label>
<!-- Horizontal Scroll / Flex Wrap Pills -->
<div class="flex flex-wrap gap-2">
<!-- Ẩm thực -->
<button class="flex items-center space-x-2 bg-[#1A1A1D] hover:bg-[#252529] text-[#8E8E93] px-3.5 py-2 rounded-full text-[13px] font-medium border border-white/5 active:scale-95 transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-[#F26A3D]"></span>
<span>Ẩm thực</span>
</button>
<!-- Cà phê (Selected) -->
<button class="flex items-center space-x-2 bg-white text-[#0E0E10] px-3.5 py-2 rounded-full text-[13px] font-semibold active:scale-95 transition-all shadow-md" type="button">
<span class="w-2 h-2 rounded-full bg-[#B8825A]"></span>
<span>Cà phê</span>
</button>
<!-- Du lịch -->
<button class="flex items-center space-x-2 bg-[#1A1A1D] hover:bg-[#252529] text-[#8E8E93] px-3.5 py-2 rounded-full text-[13px] font-medium border border-white/5 active:scale-95 transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-[#4DB6E6]"></span>
<span>Du lịch</span>
</button>
<!-- Khách sạn -->
<button class="flex items-center space-x-2 bg-[#1A1A1D] hover:bg-[#252529] text-[#8E8E93] px-3.5 py-2 rounded-full text-[13px] font-medium border border-white/5 active:scale-95 transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-[#9B87E8]"></span>
<span>Khách sạn</span>
</button>
<!-- Mua sắm -->
<button class="flex items-center space-x-2 bg-[#1A1A1D] hover:bg-[#252529] text-[#8E8E93] px-3.5 py-2 rounded-full text-[13px] font-medium border border-white/5 active:scale-95 transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-[#F06FA3]"></span>
<span>Mua sắm</span>
</button>
<!-- Giải trí -->
<button class="flex items-center space-x-2 bg-[#1A1A1D] hover:bg-[#252529] text-[#8E8E93] px-3.5 py-2 rounded-full text-[13px] font-medium border border-white/5 active:scale-95 transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-[#F5C04A]"></span>
<span>Giải trí</span>
</button>
<!-- Khác -->
<button class="flex items-center space-x-2 bg-[#1A1A1D] hover:bg-[#252529] text-[#8E8E93] px-3.5 py-2 rounded-full text-[13px] font-medium border border-white/5 active:scale-95 transition-all" type="button">
<span class="w-2 h-2 rounded-full bg-[#8E98A3]"></span>
<span>Khác</span>
</button>
</div>
</div>
<!-- Field: Địa chỉ -->
<div class="space-y-1.5 pt-0.5">
<label class="block text-xs font-medium text-[#8E8E93] pl-3">Địa chỉ</label>
<div class="bg-[#1A1A1D] rounded-[22px] px-4 py-3.5 border border-white/5 focus-within:border-white/20 transition-colors">
<input class="w-full bg-transparent border-0 p-0 text-[15px] font-normal text-white focus:ring-0 focus:outline-none placeholder-[#8E8E93]" placeholder="Nhập địa chỉ" type="text" value="39 Nguyễn Hữu Huân, Hoàn Kiếm"/>
</div>
</div>
</div>
<!-- Action: Xóa địa điểm -->
<div class="pt-6 pb-2">
<button class="w-full py-3 text-center text-[#FF453A] text-[15px] font-medium hover:opacity-80 active:scale-95 transition-all" type="button">
          Xóa địa điểm
        </button>
</div>
</main>
<!-- iOS Home Indicator -->
<div class="w-full shrink-0 h-7 flex items-center justify-center pb-2 pointer-events-none">
<div class="w-32 h-1 bg-white/30 rounded-full"></div>
</div>
</div>
</body></html>
