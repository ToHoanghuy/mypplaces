<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quên mật khẩu - MyPlaces</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0E0E10',
              surface: '#1A1A1D',
              coral: '#F26A3D',
              secondary: '#8E8E93',
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #050506;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 text-white selection:bg-[#F26A3D] selection:text-white">
<!-- iOS Device Frame Container (390px x 844px) -->
<main class="w-[390px] h-[844px] bg-[#0E0E10] relative flex flex-col justify-between overflow-hidden shadow-2xl rounded-none md:rounded-[48px] border-0 md:border-[8px] md:border-[#1E1E22]">
<!-- iOS Status Bar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-20 shrink-0 select-none">
<span class="text-[15px] font-semibold tracking-tight text-white">9:41</span>
<div class="flex items-center space-x-2 text-white">
<!-- Cellular Signal -->
<span class="material-symbols-outlined text-[17px] leading-none">signal_cellular_4_bar</span>
<!-- Wifi -->
<span class="material-symbols-outlined text-[17px] leading-none">wifi</span>
<!-- Battery -->
<span class="material-symbols-outlined text-[20px] leading-none">battery_full</span>
</div>
</header>
<!-- Top Navigation Header -->
<section class="w-full px-5 pt-3 pb-1 flex items-center justify-between z-20">
<button aria-label="Quay lại" class="w-10 h-10 rounded-full bg-[#1A1A1D] flex items-center justify-center text-white hover:opacity-85 active:scale-95 transition-all duration-150" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="arrow_back_ios_new">arrow_back_ios_new</span>
</button>
<span class="font-headline text-[17px] font-bold tracking-tight text-white">MyPlaces</span>
<div class="w-10 h-10"></div> <!-- Balance spacing placeholder -->
</section>
<!-- Scrollable/Flow Content -->
<div class="flex-1 px-6 pt-2 pb-2 flex flex-col justify-between overflow-y-auto z-10">
<!-- Top Section: Heading & Visual -->
<div class="flex flex-col space-y-4">
<!-- Title & Subtitle -->
<div class="space-y-1">
<h1 class="text-[30px] font-extrabold tracking-tight text-white leading-tight">Đặt lại mật khẩu</h1>
<p class="text-[14px] text-[#8E8E93] font-medium leading-relaxed">Nhận liên kết an toàn để khôi phục tài khoản</p>
</div>
<!-- Featured Photo Card (Hanoi Night Vibes) -->
<div class="relative w-full h-[225px] rounded-[30px] overflow-hidden bg-[#1A1A1D] shadow-lg group">
<img alt="Phố cổ Hà Nội về đêm với ánh đèn vàng ấm cúng từ các quán cóc và góc phố bình dị" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 ease-out" src="https://lh3.googleusercontent.com/aida/ALJJyrBZ6qlj2MApZZXGv1cH7E9tlYgsB6Noza5S9yhqYODeXt7hnANfC_7FtMPYPin_AT84Lz8N6JOOZsGsdet0TBfiKo6z7yn_jKHtIlfoeHXTENaoyAY7IvaWloJZ_ph_QzQSos3tR3lUHQcfWZpv1ERhO2uzplbJD0xEH7ffhXuUgq8I08Dzqxck6R6cuGVPFzceBiIGOUKpQ_JaLgGKgYX8q3tCuHnEOCFBRlMcfrSeVhLoUCIAGwPS8SI1"/>
<!-- Subtle vignette gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/20 pointer-events-none"></div>
<!-- Category / Location Badge -->
<div class="absolute bottom-3.5 left-3.5 bg-[#0E0E10]/80 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center space-x-1.5 border border-white/10 shadow-sm">
<span class="w-1.5 h-1.5 rounded-full bg-[#F26A3D] inline-block"></span>
<span class="text-[12px] font-medium text-white tracking-wide">Phố cổ Hà Nội</span>
</div>
</div>
<!-- Notification Status Card: Link Sent -->
<div class="w-full bg-[#1A1A1D] rounded-[22px] px-4 py-3.5 flex items-center space-x-3 border border-white/5 shadow-sm">
<div class="w-9 h-9 rounded-full bg-[#F26A3D]/15 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#F26A3D] text-[20px]" data-icon="mail">mail</span>
</div>
<p class="text-[13px] text-white font-medium leading-snug">
            Đã gửi liên kết đặt lại mật khẩu tới email của bạn.
          </p>
</div>
<!-- Input Field: Pre-filled Email -->
<div class="space-y-1.5 pt-0.5">
<label class="block text-[13px] font-medium text-[#8E8E93] pl-3">Email đã đăng ký</label>
<div class="w-full h-[52px] bg-[#1A1A1D] rounded-full px-5 flex items-center border border-white/10 focus-within:border-white/30 transition-colors">
<span class="material-symbols-outlined text-[#8E8E93] text-[20px] mr-3" data-icon="alternate_email">alternate_email</span>
<input class="w-full bg-transparent text-white text-[15px] font-medium focus:outline-none border-none p-0 cursor-default select-none" readonly="" type="email" value="huy@gmail.com"/>
<span class="material-symbols-outlined text-emerald-400 text-[18px] ml-2" data-icon="check_circle">check_circle</span>
</div>
</div>
</div>
<!-- Action Cluster -->
<div class="pt-4 pb-2 space-y-4 flex flex-col items-center">
<!-- Resend Button (Coral Pill) -->
<button class="w-full h-[54px] bg-[#F26A3D] hover:bg-[#fa7549] active:scale-[0.98] transition-all duration-150 rounded-full flex items-center justify-center shadow-lg shadow-[#F26A3D]/20 text-white font-bold text-[16px] tracking-wide" type="button">
          Gửi lại liên kết
        </button>
<!-- Secondary Action: Back to Login -->
<a class="inline-flex items-center text-[14px] font-medium text-[#8E8E93] hover:text-white transition-colors duration-150 py-1" href="#">
          Quay lại đăng nhập
        </a>
</div>
</div>
<!-- iOS Home Indicator -->
<footer class="w-full pb-2 pt-1 flex justify-center items-center shrink-0 select-none z-20">
<div class="w-[134px] h-[5px] bg-white/40 rounded-full"></div>
</footer>
</main>
</body></html>
