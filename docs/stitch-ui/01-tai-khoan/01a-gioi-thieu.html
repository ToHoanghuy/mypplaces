<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>MyPlaces - Bắt đầu hành trình</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0E0E10',
              surface: '#1A1A1D',
              coral: '#F26A3D',
              muted: '#8E8E93',
              dot: '#3A3A3C'
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #0E0E10;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-[#0E0E10] text-white min-h-screen flex justify-center items-center antialiased selection:bg-[#F26A3D]/30 selection:text-white">
<!-- Mobile Screen Canvas (390 x 844 aspect ratio container) -->
<main class="relative w-full max-w-[390px] h-[844px] bg-[#0E0E10] flex flex-col justify-between overflow-hidden shadow-2xl px-5 pt-0 pb-2">
<!-- Top Section: iOS Status Bar & TopAppBar -->
<header class="w-full flex-shrink-0 z-30 pt-3">
<!-- Authentic iOS Status Bar -->
<div class="w-full flex justify-between items-center px-3 pt-1 pb-2 text-[15px] font-semibold text-white tracking-tight">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular Icon -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 17 12">
<rect height="3.5" rx="0.7" width="2.8" x="0" y="8.5"></rect>
<rect height="6" rx="0.7" width="2.8" x="4.4" y="6"></rect>
<rect height="8.8" rx="0.7" width="2.8" x="8.8" y="3.2"></rect>
<rect height="11.5" rx="0.7" width="2.8" x="13.2" y="0.5"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8C10.7 2.8 13.1 3.9 14.9 5.6L16 4.4C13.9 2.4 11.1 1.2 8 1.2C4.9 1.2 2.1 2.4 0 4.4L1.1 5.6C2.9 3.9 5.3 2.8 8 2.8ZM8 6.4C9.7 6.4 11.3 7.1 12.5 8.2L13.6 7C12.1 5.6 10.2 4.8 8 4.8C5.8 4.8 3.9 5.6 2.4 7L3.5 8.2C4.7 7.1 6.3 6.4 8 6.4ZM8 9.9C8.9 9.9 9.6 10.6 9.6 11.5C9.6 11.6 9.5 11.8 9.5 11.9L8 13.5L6.5 11.9C6.5 11.8 6.4 11.6 6.4 11.5C6.4 10.6 7.1 9.9 8 9.9Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-white/90 rounded-[3px] p-[1.5px] flex items-center relative">
<div class="h-full w-[85%] bg-white rounded-[1.5px]"></div>
<div class="w-0.5 h-1.5 bg-white/90 absolute -right-1 top-0.5 rounded-r-sm"></div>
</div>
</div>
</div>
<!-- TopAppBar Component (from JSON specification) -->
<div class="flex items-center w-full px-1 pt-1 pb-1 bg-transparent justify-center"><span class="font-headline text-lg font-bold text-white tracking-tight mx-auto">MyPlaces</span></div>
</header>
<!-- Photo Hero Section (55-60% height with rounded-[32px]) -->
<section class="relative w-full h-[52%] max-h-[440px] flex-shrink-0 my-1">
<div class="relative w-full h-full rounded-[32px] overflow-hidden bg-[#1A1A1D] shadow-lg">
<img alt="Phố cổ Hà Nội về đêm với hàng quán bình dị rực rỡ ánh đèn lồng vàng ấm cúng" class="w-full h-full object-cover select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBypGEH7SkdtTL-kwQCpzTUWVx-5LnhqzmMLpwNtnvzJio_99GA_HwDIy1kldabywnvfoTyW5YqtP5dT8sjqOs1pfsD4Cami2UlkRvFtiQT71Em1mGhFCkzH02EH_DldxICjNJkn43i744w0AKJga3U1mN2eFdru88VoDKKLm-9odPlRT8d973sqLQ_Ow8BjLLUlx6gAaBTSEX0p4kp4cDqlzCFA58n5GP1vrDFLXtIfUHk8jDtFz3HJJ-ObrGlu0qa6J5cRxaaZlZQ"/>
<!-- Atmospheric soft vignette inside photo card -->
<div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent pointer-events-none"></div>
</div>
</section>
<!-- Narrative & Information Section -->
<section class="flex flex-col items-center text-center px-3 pt-2 pb-1 flex-1 justify-center">
<!-- Secondary App Mark -->
<span class="text-[13px] font-semibold text-[#8E8E93] tracking-wider uppercase mb-1">
        MyPlaces
      </span>
<!-- Primary Big Heading -->
<h1 class="font-headline font-bold text-[30px] leading-tight text-white tracking-tight mb-2">
        Nơi chốn là kỷ niệm
      </h1>
<!-- Short Helper / Value Subtitle -->
<p class="font-body text-[15px] leading-snug text-[#8E8E93] max-w-[290px] font-normal mb-5">
        Lưu nơi bạn đã đến, từng lần ghé và người đi cùng.
      </p>
<!-- Carousel Pagination Indicator -->
<div aria-label="Trình chiếu giới thiệu" class="flex items-center space-x-2" role="tablist">
<span aria-current="true" class="w-6 h-1.5 rounded-full bg-[#F26A3D] transition-all duration-300"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#3A3A3C]"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#3A3A3C]"></span>
</div>
</section>
<!-- Bottom Actions & Home Indicator -->
<footer class="w-full flex-shrink-0 flex flex-col items-center pb-2 z-20">
<!-- Primary Pill Action Button -->
<button class="w-full h-[54px] rounded-full bg-[#F26A3D] text-white font-semibold text-[17px] tracking-tight flex items-center justify-center hover:opacity-95 active:scale-[0.98] transition-all duration-150 shadow-lg shadow-[#F26A3D]/20 cursor-pointer" type="button">
        Tạo tài khoản
      </button>
<!-- Secondary Inline Action -->
<button class="mt-3.5 py-1 text-[15px] font-medium text-white/90 hover:text-white active:scale-95 transition-all duration-150" type="button">
        Tôi đã có tài khoản
      </button>
<!-- iOS Home Indicator -->
<div class="mt-4 mb-1 w-32 h-[4px] bg-white/25 rounded-full mx-auto"></div>
</footer>
</main>
</body></html>
