<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lần ghé mới - Người đi cùng</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              bg: "#0E0E10",
              surface: "#1A1A1D",
              subsurface: "#242428",
              field: "#141416",
              coral: "#F26A3D",
              secondary: "#8E8E93",
              border: "#2C2C30"
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
<style>
    body {
      background-color: #0E0E10;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background-color: #F26A3D;
      animation: cursor-blink 1s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
  </style>
</head>
<body class="relative w-full min-h-screen bg-brand-bg flex flex-col justify-between overflow-hidden">
<!-- ==================== LỚP NỀN PHÍA SAU (DIMMED BACKGROUND) ==================== -->
<div class="absolute inset-0 z-0 flex flex-col">
<!-- iOS Status Bar (Simulated) -->
<header class="w-full pt-3 px-7 flex justify-between items-center text-white text-sm font-semibold z-20 select-none">
<span class="tracking-tight text-[15px]">9:41</span>
<div class="flex items-center gap-1.5 text-white">
<span class="material-symbols-outlined text-[17px]" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[20px]" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- Shared Component: TopAppBar -->
<div class="flex justify-between items-center w-full px-4 h-11 fixed top-0 left-0 z-50 bg-transparent text-white flat no shadows">
<button class="font-headline text-base font-normal text-white hover:opacity-80 transition-opacity active:opacity-60 pt-7" type="button">
        Hủy
      </button>
<h1 class="font-headline text-base font-semibold text-white pt-7 tracking-tight">
        Lần ghé mới
      </h1>
<div class="w-10"></div>
</div>
<!-- Màn hình tạo lần ghé bị làm mờ & tối -->
<main class="w-full px-5 pt-20 flex flex-col gap-4 opacity-40 blur-[2px] transition-all">
<!-- Ảnh quán cà phê đang tạo lần ghé -->
<div class="relative w-full aspect-[4/3] rounded-[28px] overflow-hidden bg-brand-surface shadow-lg">
<img alt="Quán cà phê trứng Hà Nội truyền thống" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ALJJyrDFVqeYp_oPLCTt6_xWENugcfYiLmswhNlB8KzgSSX3pnKq-k2-WSMtNKOesxZ8s_uquvQIWyw9L_peawOo18wAlMUnRlGD7PEMZrDPVWFgwnBUbOiqzrztWcQaDoGSoCf_x9a6G_pKxBihMDkWxSL_mRd_MQi2v7sruOq5yyILY4dTGu5Mmn1GhLypNv7VxCufq5YmEgWY9P6KqyJfHg7bh0eiOwxyOCMrvtW1-c8onx82pDCWS1AQaKk"/>
<div class="absolute top-3 left-3 bg-black/50 backdrop-blur-md px-3 py-1 rounded-full flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-[#B8825A]"></span>
<span class="text-xs font-medium text-white">Cà phê</span>
</div>
</div>
<!-- Địa điểm tóm tắt -->
<div class="p-4 rounded-[24px] bg-brand-surface/60 flex flex-col gap-1">
<span class="text-xs text-brand-secondary">Địa điểm</span>
<span class="text-white font-medium text-base">Cà phê Giảng, Hoàn Kiếm</span>
</div>
</main>
<!-- Backdrop Overlay -->
<div class="absolute inset-0 bg-black/60 backdrop-blur-sm z-20"></div>
</div>
<!-- ==================== BOTTOM SHEET: NGƯỜI ĐI CÙNG ==================== -->
<section class="relative z-30 mt-auto w-full bg-[#1A1A1D] rounded-t-[32px] pt-3 px-6 pb-2 flex flex-col shadow-2xl transition-transform">
<!-- Thanh kéo (Drag Handle) -->
<div class="w-full flex justify-center py-1">
<div class="w-9 h-1 rounded-full bg-white/20"></div>
</div>
<!-- Tiêu đề Sheet -->
<div class="text-center mt-2 mb-4">
<h2 class="text-lg font-semibold text-white tracking-tight">Người đi cùng</h2>
</div>
<!-- Ô nhập dạng Pill tìm/thêm nhanh -->
<div class="w-full bg-[#141416] rounded-full pl-4 pr-1.5 py-1.5 flex items-center justify-between border border-[#242428] focus-within:border-[#3A3A3E] transition-colors">
<div class="flex items-center gap-2 flex-1 min-w-0 pr-2">
<span class="material-symbols-outlined text-brand-secondary text-[20px]" data-icon="search">search</span>
<div class="flex items-center text-white text-[15px] font-medium leading-none">
<span>Mẹ</span>
<span class="typing-cursor"></span>
</div>
</div>
<button class="bg-[#F26A3D] text-white text-xs font-medium px-4 py-2 rounded-full active:opacity-80 transition-opacity flex-shrink-0" type="button">
        Thêm
      </button>
</div>
<!-- Tiêu đề phụ phân nhóm -->
<div class="mt-5 mb-2.5">
<span class="text-xs font-medium text-[#8E8E93]">Người đã chia sẻ với bạn</span>
</div>
<!-- Danh sách thành viên -->
<div class="flex flex-col">
<!-- Hàng 1: Đã chọn -->
<div class="flex items-center justify-between py-2.5 active:opacity-75 transition-opacity">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full overflow-hidden bg-brand-surface flex-shrink-0 ring-1 ring-white/10">
<img alt="Linh Trần" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ALJJyrC1pZNbywjA9AQdv6pIg-U5XgRJJ_HiNxWceCyA7NB-cR3lDgnc6L63a3izkc84gsctGokFvXkdIF3b_6TJHdoNdjQ-bq47-YfIRPhoF4wPR-iYArSo5C7Ppv-IiB45W-0Ua8-93qA8PiCC39DrWOu4PbMHx5RmMzMacOVcAf68MhCBlPrKt0UrIyjN1GJjM9HqlXqDC9okzNxQE5XQbAuq_ESKwmi2fwk62vvopIS7Eqtco311M13pqA"/>
</div>
<span class="text-white text-[15px] font-medium">Linh Trần</span>
</div>
<!-- Vòng tròn đã chọn với tick coral -->
<div class="w-6 h-6 rounded-full bg-[#F26A3D] flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined text-[17px] font-bold" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Phân cách siêu mảnh -->
<div class="w-full h-[1px] bg-white/[0.04]"></div>
<!-- Hàng 2: Chưa chọn -->
<div class="flex items-center justify-between py-2.5 active:opacity-75 transition-opacity">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full overflow-hidden bg-brand-surface flex-shrink-0 ring-1 ring-white/10">
<img alt="Minh Anh" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ALJJyrAn_ScS6paEDEgr_7vjk6J_NxW42Ahdt638eB1qVKi1IjcoUQooa1qEpXrYm1Sq3p9GnR9OR7S_i5x6S1ahho1D8tmMDg7IE1Mqyz2-zEPRlEbNJNfMMqHhSyOrSBv7D8m9p0YHqZLAC92wRophE2jEN6cByFGdLGg-JUdqMXf50YY8UBN5I1hC0ee3sfaSo0S5Mb4w9IgqtDbNopXAB9SEmkgx9zEQFOolw__tbnWL1670ZTAyoH1m29U"/>
</div>
<span class="text-white text-[15px] font-medium">Minh Anh</span>
</div>
<!-- Vòng tròn rỗng -->
<div class="w-6 h-6 rounded-full border border-[#3A3A3C]"></div>
</div>
<!-- Phân cách siêu mảnh -->
<div class="w-full h-[1px] bg-white/[0.04]"></div>
<!-- Hàng 3: Chưa chọn -->
<div class="flex items-center justify-between py-2.5 active:opacity-75 transition-opacity">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full overflow-hidden bg-brand-surface flex-shrink-0 ring-1 ring-white/10">
<img alt="Quốc Bảo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ALJJyrAuYIXXabeb1Mzhh7DT4D85tBgPNvM6QRDWn-tst7nBrJzmLm__L36d5jkxefZtfWug1dr5QPTtJYtsbPaTdehqRHSleRVw1ID8dBx-5SsaXgIY6ePrGTtO5ND0pkgXtkG714eceO3tEkcliKvPTEN806qRcp4cwn7lwnUf5E3eeAkEy64oqlfUdd1QcFZp_ElaSJ2cSQAGvIh33YSxguzvf8rHKlWyCuAaYa9JRD236l8jpwKeLnOnkQ"/>
</div>
<span class="text-white text-[15px] font-medium">Quốc Bảo</span>
</div>
<!-- Vòng tròn rỗng -->
<div class="w-6 h-6 rounded-full border border-[#3A3A3C]"></div>
</div>
</div>
<!-- Thông báo bảo mật tinh gọn -->
<div class="mt-4 mb-5 flex items-center justify-center gap-1.5 text-center text-[#8E8E93] text-xs">
<span class="material-symbols-outlined text-[14px]" data-icon="lock">lock</span>
<span>Không gửi lời mời và không cấp quyền xem</span>
</div>
<!-- Nút chính: Xong -->
<div class="w-full pb-3">
<button class="w-full bg-[#FFFFFF] text-[#0E0E10] text-[16px] font-bold py-3.5 rounded-full active:opacity-90 transition-opacity" type="button">
        Xong
      </button>
</div>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center pb-2 pt-1">
<div class="w-32 h-1 bg-white/30 rounded-full"></div>
</div>
</section>
</body></html>
