<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lần ghé mới</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            app: {
              bg: "#0E0E10",
              surface: "#1A1A1D",
              surfaceSubtle: "#242428",
              surfaceMuted: "#2C2C30",
              coral: "#F26A3D",
              coffee: "#B8825A",
              borderDashed: "#333338",
              textSecondary: "#8E8E93"
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #070708;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen text-white bg-black select-none">
<!-- iPhone 14/15 Pro frame wrapper (390 x 844) -->
<main class="relative w-full max-w-[390px] h-[844px] bg-[#0E0E10] overflow-hidden flex flex-col justify-between shadow-2xl rounded-[48px] border border-white/5">
<!-- iOS Status Bar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-40 shrink-0 text-white">
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<div class="flex items-center space-x-1.5">
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.8" width="3" x="0" y="8"></rect>
<rect height="6.5" rx="0.8" width="3" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.8" width="3" x="9" y="3"></rect>
<rect height="11.5" rx="0.8" width="3" x="13.5" y="0.5"></rect>
</svg>
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path clip-rule="evenodd" d="M8 2.2C5.3 2.2 2.8 3.3 1 5.2L0 4.1C2.1 1.9 5 0.6 8 0.6C11 0.6 13.9 1.9 16 4.1L15 5.2C13.2 3.3 10.7 2.2 8 2.2ZM8 6.4C6.4 6.4 4.9 7.1 3.8 8.2L2.7 7.1C4.1 5.7 6 4.8 8 4.8C10 4.8 11.9 5.7 13.3 7.1L12.2 8.2C11.1 7.1 9.6 6.4 8 6.4ZM8 10.6C7.5 10.6 7 10.8 6.6 11.2L8 12.6L9.4 11.2C9 10.8 8.5 10.6 8 10.6Z" fill-rule="evenodd"></path>
</svg>
<div class="flex items-center">
<div class="w-5 h-2.5 border border-white rounded-[3px] p-[1px] flex items-center">
<div class="h-full w-full bg-white rounded-[1.5px]"></div>
</div>
<div class="w-[1.5px] h-1 bg-white ml-[1px] rounded-r-sm"></div>
</div>
</div>
</header>
<!-- Top Navigation Bar (Shared Component: TopAppBar small_center_aligned) -->
<nav class="flex justify-between items-center w-full px-5 h-11 shrink-0 z-40 bg-transparent">
<button class="text-white hover:opacity-80 active:opacity-60 transition-opacity text-base font-normal" type="button">
        Hủy
      </button>
<h1 class="font-headline text-base font-semibold text-white tracking-tight">
        Lần ghé mới
      </h1>
<div class="w-8"></div>
</nav>
<!-- Main Content Area -->
<div class="flex-1 overflow-y-auto hide-scrollbar px-5 pt-1 pb-4 flex flex-col space-y-4">
<!-- Place Row -->
<section class="flex items-center space-x-3 bg-[#1A1A1D] px-3.5 py-2.5 rounded-[22px]">
<div class="w-8 h-8 rounded-full overflow-hidden bg-stone-800 shrink-0 border border-white/10">
<img alt="Cà phê Giảng" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrZ9Yrg9X6vv2zZR0vp-H3x2Ffk9zMhGzREx-pgiYR7u-qrVwQF3HhYcj2VBjTUg_Rl7EAHhDFZQyfLBPX2uflmHIxtzGNbGa_ur0XqeqyvcTEWPp6prniodRRysKG8xX56khpOJMauC5Bepf6q9L2jxcGZEPIxp421hCisEhySjg-PcpClxP8oLf-zYUexMHttQNNWVCPditLHYDL3CnQMAnZbhLxwjrlLjQGCMoOPcnhFiaRVL4Q5DSli0Cn0twJjatVQf349fQ"/>
</div>
<div class="flex items-center space-x-2 min-w-0 flex-1">
<span class="font-semibold text-white text-[15px] truncate">Cà phê Giảng</span>
<span class="w-2 h-2 rounded-full bg-[#B8825A] shrink-0" title="Cà phê"></span>
</div>
</section>
<!-- Photos Section -->
<section class="grid grid-cols-12 gap-3 items-stretch">
<!-- Main Photo -->
<div class="col-span-8 aspect-square relative rounded-[28px] overflow-hidden bg-[#1A1A1D] shadow-sm">
<img alt="Cà phê trứng Hà Nội" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrZ9Yrg9X6vv2zZR0vp-H3x2Ffk9zMhGzREx-pgiYR7u-qrVwQF3HhYcj2VBjTUg_Rl7EAHhDFZQyfLBPX2uflmHIxtzGNbGa_ur0XqeqyvcTEWPp6prniodRRysKG8xX56khpOJMauC5Bepf6q9L2jxcGZEPIxp421hCisEhySjg-PcpClxP8oLf-zYUexMHttQNNWVCPditLHYDL3CnQMAnZbhLxwjrlLjQGCMoOPcnhFiaRVL4Q5DSli0Cn0twJjatVQf349fQ"/>
</div>
<!-- Add Photo Box -->
<button aria-label="Thêm ảnh" class="col-span-4 aspect-square rounded-[24px] bg-[#1A1A1D] border-2 border-dashed border-[#333338] flex items-center justify-center text-[#8E8E93] hover:text-white hover:border-white/30 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[26px]">add</span>
</button>
</section>
<!-- Date & Time Row -->
<section class="bg-[#1A1A1D] px-4 py-3.5 rounded-[22px] flex items-center justify-between">
<span class="text-[#8E8E93] text-[15px]">Thời gian</span>
<div class="text-right">
<p class="text-white text-[15px] font-medium tracking-tight">Hôm nay, 15:30</p>
<p class="text-[12px] text-[#8E8E93] tracking-tight">Giờ Hà Nội</p>
</div>
</section>
<!-- Short Note Input -->
<section class="bg-[#1A1A1D] rounded-[22px] p-4">
<textarea class="w-full bg-transparent text-white placeholder-[#8E8E93] text-[15px] focus:outline-none resize-none border-none p-0 leading-relaxed" placeholder="Ghi chú ngắn…" rows="2"></textarea>
</section>
<!-- Participants Row -->
<section class="bg-[#1A1A1D] rounded-[22px] p-4 space-y-3">
<h2 class="text-[#8E8E93] text-[13px] font-medium tracking-tight">Người đi cùng</h2>
<div class="flex items-center space-x-3.5 overflow-x-auto hide-scrollbar pt-0.5">
<!-- Participant 1: Linh -->
<div class="flex flex-col items-center space-y-1.5 shrink-0">
<div class="w-11 h-11 rounded-full overflow-hidden p-[1px] bg-white/10 shrink-0">
<img alt="Linh" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJcJkEfMYksH8os3BpiHz-pX88VnSsCT7VlrY3BGfiJiB93Ws9SgjhbuONc7Pks7BKCUuwA5JKc3Yn9qp9FyrgLJyzGXVsuqwfCglUZxSGT28cy8bLLueZaF933_5XETwtDm6Z7l3S3ofHDmvROCmAs-uFPP8tQMfa9e2IHGhDmEIIUDAio9-NL-BPfoZVvXVUD6PUs3bIdduiTT7bBu7snO0Enxh55XByqnEZ5ehJ-cJXjsnSh9r7mt1Me3w3ghsO2xHwAyOFFY4"/>
</div>
<span class="text-[12px] text-white/90 font-medium">Linh</span>
</div>
<!-- Participant 2: Mẹ -->
<div class="flex flex-col items-center space-y-1.5 shrink-0">
<div class="w-11 h-11 rounded-full bg-[#2C2C30] flex items-center justify-center shrink-0 border border-white/5">
<span class="text-white text-sm font-semibold">M</span>
</div>
<span class="text-[12px] text-white/90 font-medium">Mẹ</span>
</div>
<!-- Add Participant Button -->
<div class="flex flex-col items-center space-y-1.5 shrink-0">
<button aria-label="Thêm người đi cùng" class="w-11 h-11 rounded-full bg-[#242428] border border-white/10 flex items-center justify-center text-[#8E8E93] hover:text-white active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
<span class="text-[12px] text-transparent select-none">Thêm</span>
</div>
</div>
</section>
</div>
<!-- Bottom Action Button & iOS Home Indicator -->
<footer class="w-full px-5 pt-2 pb-2 shrink-0 bg-gradient-to-t from-[#0E0E10] via-[#0E0E10] to-transparent">
<button class="w-full h-[52px] bg-[#F26A3D] text-white font-semibold text-[16px] rounded-full active:scale-[0.98] transition-transform shadow-lg shadow-[#F26A3D]/20 flex items-center justify-center" type="button">
        Lưu lần ghé
      </button>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center items-center pt-4 pb-1">
<div class="w-[134px] h-[5px] bg-white/30 rounded-full"></div>
</div>
</footer>
</main>
</body></html>
