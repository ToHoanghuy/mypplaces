<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thêm kỷ niệm</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#0E0E10',
              surface: '#1A1A1D',
              secondary: '#8E8E93',
              coral: '#F26A3D',
              coffee: '#B8825A'
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #050506;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 text-white select-none">
<!-- iPhone 390x844 Canvas Frame -->
<main class="w-full max-w-[390px] h-[844px] bg-[#0E0E10] text-white flex flex-col relative overflow-hidden shadow-2xl rounded-none sm:rounded-[44px]">
<!-- iOS Status Bar -->
<header class="w-full h-11 px-7 flex justify-between items-center z-50 text-[14px] font-semibold text-white tracking-tight shrink-0 select-none">
<span>9:41</span>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px] leading-none" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[20px] leading-none" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- Top Navigation Bar (Shared Component Style: TopAppBar) -->
<div class="w-full px-5 h-12 flex items-center justify-between z-40 shrink-0">
<button class="text-sm font-medium text-[#8E8E93] hover:text-white transition-colors duration-150 active:opacity-60" type="button">
        Hủy
      </button>
<h1 class="font-headline text-base font-semibold text-white tracking-tight">
        Kỷ niệm
      </h1>
<button class="bg-[#F26A3D] text-white text-xs font-semibold px-4 py-1.5 rounded-full hover:opacity-90 active:scale-95 transition-all" type="button">
        Đăng
      </button>
</div>
<!-- Content Area -->
<div class="flex-1 flex flex-col px-5 pt-1 overflow-y-auto overflow-x-hidden">
<!-- Context Pill Anchor -->
<div class="flex items-center self-start my-2">
<div class="bg-[#1A1A1D] px-3.5 py-1.5 rounded-full inline-flex items-center gap-2 border border-white/5">
<span class="w-2 h-2 rounded-full bg-[#B8825A] shrink-0"></span>
<span class="text-xs text-[#8E8E93] font-normal tracking-normal truncate max-w-[280px]">
            Vào: Lần ghé · 12 thg 10 · Cà phê Giảng
          </span>
</div>
</div>
<!-- Photos Grid (2 square cards with rounded-3xl) -->
<section class="grid grid-cols-2 gap-3.5 mt-3 mb-4">
<!-- Photo 1: Cà phê trứng Giảng -->
<article class="relative aspect-square w-full rounded-[24px] overflow-hidden bg-[#1A1A1D] group">
<img alt="Cà phê trứng Giảng" class="w-full h-full object-cover select-none" src="https://lh3.googleusercontent.com/aida/ALJJyrDFVqeYp_oPLCTt6_xWENugcfYiLmswhNlB8KzgSSX3pnKq-k2-WSMtNKOesxZ8s_uquvQIWyw9L_peawOo18wAlMUnRlGD7PEMZrDPVWFgwnBUbOiqzrztWcQaDoGSoCf_x9a6G_pKxBihMDkWxSL_mRd_MQi2v7sruOq5yyILY4dTGu5Mmn1GhLypNv7VxCufq5YmEgWY9P6KqyJfHg7bh0eiOwxyOCMrvtW1-c8onx82pDCWS1AQaKk"/>
<button aria-label="Xóa ảnh" class="absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-white/90 hover:bg-black/80 active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="close">close</span>
</button>
</article>
<!-- Photo 2: Trò chuyện kèm vòng tròn tiến trình tải lên -->
<article class="relative aspect-square w-full rounded-[24px] overflow-hidden bg-[#1A1A1D] group">
<img alt="Hai bạn trò chuyện ở Cà phê Giảng" class="w-full h-full object-cover select-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCaYQi_rToYipg1M3KULxcA3xRDwWYPtxeqxarcW3t5ExVMf6AzIL4J4TAuhIb9W7cU1UYCATAsAxynpGCvq0p3UhFCiS9GAK9rWG9rZcrqV8HBl7Blo3MKsWoZPN5boG-TjZanBZX6XdwK2-C74L9df6DSaUW-8g2P6jnjdUFIvsf8O5_c3mwwG5l0RGzyjP-xjVt-76-74UEZLLJbp2P0_2O89Yt_U__Fu_bXWqcGXe_hYBVjLNn4iD6DRES_p6JfYCrEbCWF7DM"/>
<!-- Dismiss button -->
<button aria-label="Xóa ảnh" class="absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-white/90 z-20 hover:bg-black/80 active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="close">close</span>
</button>
<!-- Upload Progress Overlay (60%) -->
<div class="absolute inset-0 bg-black/55 backdrop-blur-[2px] flex flex-col items-center justify-center z-10 select-none">
<div class="relative w-12 h-12 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<!-- Track -->
<circle cx="18" cy="18" fill="none" r="14.5" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2.5"></circle>
<!-- Progress indicator 60% -->
<circle cx="18" cy="18" fill="none" r="14.5" stroke="#F26A3D" stroke-dasharray="91" stroke-dashoffset="36.4" stroke-linecap="round" stroke-width="2.5"></circle>
</svg>
<span class="absolute text-[11px] font-semibold text-white tracking-tighter">60%</span>
</div>
<span class="text-[11px] text-[#8E8E93] mt-2 font-medium">Đang tải lên…</span>
</div>
</article>
</section>
<!-- Text Note Input Area (borderless, transparent) -->
<section class="flex-1 mt-1 flex flex-col">
<textarea class="w-full bg-transparent border-0 resize-none p-0 text-white text-base leading-relaxed placeholder-[#8E8E93]/60 focus:ring-0 focus:outline-none selection:bg-[#F26A3D]/40 font-normal" placeholder="Viết vài dòng…" rows="4">Lần đầu Linh thử cà phê trứng</textarea>
</section>
<!-- Bottom Utility Bar & Privacy Information -->
<footer class="mt-auto pb-4 flex flex-col gap-3">
<!-- Media Quick Actions -->
<div class="flex items-center gap-2">
<button class="bg-[#1A1A1D] h-9 px-3.5 rounded-full inline-flex items-center gap-2 text-[#8E8E93] hover:text-white transition-colors border border-white/5 active:scale-95" type="button">
<span class="material-symbols-outlined text-[19px] leading-none" data-icon="photo_library">photo_library</span>
<span class="text-xs font-medium">Thư viện</span>
</button>
<button aria-label="Máy ảnh" class="bg-[#1A1A1D] w-9 h-9 rounded-full flex items-center justify-center text-[#8E8E93] hover:text-white transition-colors border border-white/5 active:scale-95" type="button">
<span class="material-symbols-outlined text-[19px] leading-none" data-icon="photo_camera">photo_camera</span>
</button>
</div>
<!-- Privacy Permission Indicator -->
<div class="flex items-center gap-1.5 text-[11px] text-[#8E8E93] pt-1">
<span class="material-symbols-outlined text-[13px] leading-none text-[#8E8E93]" data-icon="lock">lock</span>
<span>Hiển thị với người có quyền xem lần ghé này</span>
</div>
</footer>
</div>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center pb-2 pt-1 shrink-0 z-50">
<div class="w-32 h-1 bg-white/30 rounded-full"></div>
</div>
</main>
</body></html>
