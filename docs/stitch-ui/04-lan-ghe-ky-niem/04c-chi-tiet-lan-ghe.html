<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chi tiết lần ghé - MyPlaces Minimal</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            app: "#0E0E10",
            surface: "#1A1A1D",
            secondary: "#8E8E93",
            coral: "#F26A3D",
            cafe: "#B8825A"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "card": "32px",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #0E0E10;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Touch scroll containment */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#0E0E10] text-white flex justify-center min-h-screen antialiased select-none">
<!-- Mobile Container (390x844 ratio emulation for high-end preview) -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#0E0E10] flex flex-col justify-between overflow-hidden shadow-2xl">
<!-- iOS Status Bar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-40 shrink-0">
<span class="text-white font-semibold text-[15px] tracking-tight">9:41</span>
<div class="flex items-center gap-1.5 text-white">
<!-- Cellular Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.5" width="2.5" x="9" y="3"></rect>
<rect height="12" rx="0.5" width="2.5" x="13.5" y="0"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.5C10.7 2.5 13.1 3.6 14.8 5.4L16 4.1C13.9 2 11.1 0.7 8 0.7C4.9 0.7 2.1 2 0 4.1L1.2 5.4C2.9 3.6 5.3 2.5 8 2.5ZM8 6.5C9.7 6.5 11.2 7.2 12.3 8.3L13.5 7C12.1 5.6 10.1 4.7 8 4.7C5.9 4.7 3.9 5.6 2.5 7L3.7 8.3C4.8 7.2 6.3 6.5 8 6.5ZM8 10C8.8 10 9.5 10.7 9.5 11.5C9.5 12.3 8.8 13 8 13C7.2 13 6.5 12.3 6.5 11.5C6.5 10.7 7.2 10 8 10Z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-5 h-2.5 rounded-sm border border-white/90 p-0.5 flex items-center">
<div class="w-full h-full bg-white rounded-2xs"></div>
</div>
<div class="w-0.5 h-1 bg-white/80 rounded-r-xs ml-0.5"></div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-3 pt-2 pb-1 overflow-y-auto no-scrollbar">
<!-- Photo Hero Box (Occupies approx 65% of viewport height) -->
<section class="relative w-full h-[515px] rounded-[32px] overflow-hidden shrink-0 shadow-lg">
<!-- Main Visit Image -->
<img alt="Cà phê Giảng - Lần ghé đáng nhớ" class="w-full h-full object-cover select-none" src="https://lh3.googleusercontent.com/aida/ALJJyrDFVqeYp_oPLCTt6_xWENugcfYiLmswhNlB8KzgSSX3pnKq-k2-WSMtNKOesxZ8s_uquvQIWyw9L_peawOo18wAlMUnRlGD7PEMZrDPVWFgwnBUbOiqzrztWcQaDoGSoCf_x9a6G_pKxBihMDkWxSL_mRd_MQi2v7sruOq5yyILY4dTGu5Mmn1GhLypNv7VxCufq5YmEgWY9P6KqyJfHg7bh0eiOwxyOCMrvtW1-c8onx82pDCWS1AQaKk"/>
<!-- Top Floating Overlay Header (Back & Options) -->
<div class="absolute top-0 inset-x-0 pt-3.5 px-3.5 flex items-center justify-between z-20">
<button aria-label="Quay lại" class="backdrop-blur-md bg-black/40 text-white w-10 h-10 flex items-center justify-center rounded-full active:opacity-60 transition-opacity" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-xl">arrow_back</span>
</button>
<!-- Small Top Pagination Indicator -->
<div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full bg-black/30 backdrop-blur-md">
<div class="w-4 h-1.5 bg-white rounded-full transition-all"></div>
<div class="w-1.5 h-1.5 bg-white/40 rounded-full"></div>
<div class="w-1.5 h-1.5 bg-white/40 rounded-full"></div>
</div>
<button aria-label="Tùy chọn khác" class="backdrop-blur-md bg-black/40 text-white w-10 h-10 flex items-center justify-center rounded-full active:opacity-60 transition-opacity" type="button">
<span class="material-symbols-outlined text-xl">more_horiz</span>
</button>
</div>
<!-- Bottom Image Content Gradient Overlay -->
<div class="absolute inset-x-0 bottom-0 pt-20 pb-5 px-5 bg-gradient-to-t from-black/95 via-black/50 to-transparent flex flex-col justify-end z-20">
<!-- Category Indicator & Place Name -->
<div class="flex items-center mb-1">
<span class="w-2 h-2 rounded-full inline-block mr-2 bg-[#B8825A]"></span>
<span class="text-white/90 text-xs font-medium tracking-wide">Cà phê Giảng</span>
</div>
<!-- Main Timestamp Heading -->
<h1 class="font-headline font-bold text-white text-[21px] leading-tight tracking-tight">
            Thứ Bảy, 12 thg 10 · 15:30
          </h1>
<!-- Bottom Row: Short Note & Participant Avatars -->
<div class="flex items-end justify-between mt-1.5 gap-3">
<p class="text-sm text-white/90 font-normal leading-snug line-clamp-2 pr-1">
              Trời se lạnh, uống cà phê trứng với Linh.
            </p>
<!-- Participant Avatars Stacked -->
<div class="flex items-center -space-x-2 shrink-0 pl-1 mb-0.5">
<img alt="Linh" class="w-6 h-6 rounded-full border-2 border-[#0E0E10] object-cover ring-1 ring-black/20" src="https://lh3.googleusercontent.com/aida/ALJJyrC1pZNbywjA9AQdv6pIg-U5XgRJJ_HiNxWceCyA7NB-cR3lDgnc6L63a3izkc84gsctGokFvXkdIF3b_6TJHdoNdjQ-bq47-YfIRPhoF4wPR-iYArSo5C7Ppv-IiB45W-0Ua8-93qA8PiCC39DrWOu4PbMHx5RmMzMacOVcAf68MhCBlPrKt0UrIyjN1GJjM9HqlXqDC9okzNxQE5XQbAuq_ESKwmi2fwk62vvopIS7Eqtco311M13pqA"/>
<img alt="Bạn đồng hành" class="w-6 h-6 rounded-full border-2 border-[#0E0E10] object-cover ring-1 ring-black/20" src="https://lh3.googleusercontent.com/aida/ALJJyrAn_ScS6paEDEgr_7vjk6J_NxW42Ahdt638eB1qVKi1IjcoUQooa1qEpXrYm1Sq3p9GnR9OR7S_i5x6S1ahho1D8tmMDg7IE1Mqyz2-zEPRlEbNJNfMMqHhSyOrSBv7D8m9p0YHqZLAC92wRophE2jEN6cByFGdLGg-JUdqMXf50YY8UBN5I1hC0ee3sfaSo0S5Mb4w9IgqtDbNopXAB9SEmkgx9zEQFOolw__tbnWL1670ZTAyoH1m29U"/>
<div class="w-6 h-6 rounded-full border-2 border-[#0E0E10] bg-[#1A1A1D] flex items-center justify-center text-[9px] font-medium text-white/80">
                +1
              </div>
</div>
</div>
</div>
</section>
<!-- Memories Section -->
<section class="mt-4 px-2 flex-1">
<h2 class="text-[11px] font-semibold text-[#8E8E93] uppercase tracking-wider mb-2.5 px-1">
          Kỷ niệm
        </h2>
<!-- Memories List -->
<div class="space-y-3">
<!-- Item 1: Linh Tran -->
<article class="flex items-start gap-3 px-2 py-1 rounded-2xl hover:bg-[#1A1A1D]/40 transition-colors">
<img alt="Linh Trần" class="w-8 h-8 rounded-full object-cover shrink-0 mt-0.5" src="https://lh3.googleusercontent.com/aida/ALJJyrC1pZNbywjA9AQdv6pIg-U5XgRJJ_HiNxWceCyA7NB-cR3lDgnc6L63a3izkc84gsctGokFvXkdIF3b_6TJHdoNdjQ-bq47-YfIRPhoF4wPR-iYArSo5C7Ppv-IiB45W-0Ua8-93qA8PiCC39DrWOu4PbMHx5RmMzMacOVcAf68MhCBlPrKt0UrIyjN1GJjM9HqlXqDC9okzNxQE5XQbAuq_ESKwmi2fwk62vvopIS7Eqtco311M13pqA"/>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2">
<span class="text-white font-medium text-sm truncate">Linh Trần</span>
<span class="text-[#8E8E93] text-xs shrink-0">2 giờ trước</span>
</div>
<p class="text-[13px] text-white/85 leading-snug mt-0.5">
                Cà phê trứng ở đây vẫn là đỉnh nhất!
              </p>
</div>
</article>
<!-- Item 2: Author / Friend -->
<article class="flex items-start gap-3 px-2 py-1 rounded-2xl hover:bg-[#1A1A1D]/40 transition-colors">
<img alt="Bạn" class="w-8 h-8 rounded-full object-cover shrink-0 mt-0.5" src="https://lh3.googleusercontent.com/aida/ALJJyrAn_ScS6paEDEgr_7vjk6J_NxW42Ahdt638eB1qVKi1IjcoUQooa1qEpXrYm1Sq3p9GnR9OR7S_i5x6S1ahho1D8tmMDg7IE1Mqyz2-zEPRlEbNJNfMMqHhSyOrSBv7D8m9p0YHqZLAC92wRophE2jEN6cByFGdLGg-JUdqMXf50YY8UBN5I1hC0ee3sfaSo0S5Mb4w9IgqtDbNopXAB9SEmkgx9zEQFOolw__tbnWL1670ZTAyoH1m29U"/>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2">
<span class="text-white font-medium text-sm truncate">Bạn</span>
<span class="text-[#8E8E93] text-xs shrink-0">Hôm qua</span>
</div>
<p class="text-[13px] text-white/85 leading-snug mt-0.5">
                Không gian hoài niệm quá.
              </p>
</div>
</article>
</div>
</section>
</main>
<!-- Bottom Action Row & Safe Area -->
<footer class="w-full px-4 pb-2 pt-1 shrink-0 bg-[#0E0E10] z-30">
<div class="flex items-center gap-3">
<!-- Primary Action Button: Pill Coral -->
<button class="flex-1 bg-[#F26A3D] hover:bg-[#F26A3D]/90 active:scale-[0.98] transition-all text-white font-semibold text-sm py-3.5 px-6 rounded-full flex items-center justify-center gap-2 shadow-lg shadow-[#F26A3D]/15" type="button">
<span class="material-symbols-outlined text-lg leading-none">add</span>
<span>Thêm kỷ niệm</span>
</button>
<!-- Secondary Action: Share Button -->
<button aria-label="Chia sẻ lần ghé" class="w-12 h-12 bg-[#1A1A1D] hover:bg-[#252529] active:scale-95 transition-all text-white rounded-full flex items-center justify-center shrink-0" type="button">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
<polyline points="16 6 12 2 8 6"></polyline>
<line x1="12" x2="12" y1="2" y2="15"></line>
</svg>
</button>
</div>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-white/30 rounded-full mx-auto mt-4 mb-1"></div>
</footer>
</div>
</body></html>
