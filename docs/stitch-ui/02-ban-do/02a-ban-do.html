<div class="absolute left-2.5 top-0 w-[44px] h-[44px] rounded-full border-[2.5px] border-white bg-[#1A1A1D] overflow-hidden shadow-xl">
<img class="w-full h-full object-cover" data-alt="Traditional Hanoi steamed rice rolls banh cuon glistening with fried shallots served on a dark matte plate. Clean, dark minimalist culinary capture." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMdlbtizrF0U9FKvN6AKb5GSE-OEOtV8rRRj-L_8x8HLXmRfCa53psv7o04xB-r3ymfOrJ18aCwGlMNudHgP_fpN9gQPbdesxJ5iTm7VePjHVBhwQgOypyYkWpG3yKkZy-oBjUt8WPZ9cP09yZpPgk7ADm_bx5fC9X6tW28s1QM2qxfDtB_l7iKawYzHIElS9IGoZZzpoNkMHAgXihwFfdL5H68OT4RhuMv48YQ2W8ctvB1uV6D0IJVeAiE8fvDmHi9ZjtxTZ5Tvfd"/>
</div>
<!-- Cluster counter bubble -->
<div class="absolute -top-1 right-0 bg-white text-[#0E0E10] text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-md min-w-[19px] text-center">
          +3
        </div>
</div>
</div>
<!-- 4. TOP APP BAR & STATUS BAR OVERLAYS -->
<!-- iOS Status Bar (9:41, wifi, battery) -->
<header class="absolute top-0 inset-x-0 z-40 h-11 px-7 flex items-center justify-between text-white text-[14px] font-semibold tracking-tight pointer-events-none">
<span>9:41</span>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[17px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[17px]">wifi</span>
<!-- Native-like battery indicator -->
<div class="w-5 h-2.5 rounded-[4px] border border-white/90 p-[1px] flex items-center ml-0.5">
<div class="h-full w-full bg-white rounded-[2px]"></div>
</div>
</div>
</header>
<!-- Floating Search Pill (TopAppBar JSON blueprint & Minimal Locket aesthetic) -->
<div class="absolute top-12 inset-x-0 z-40 px-4">
<div class="backdrop-blur-md bg-[#1A1A1D]/80 border border-white/10 text-white rounded-full px-4 py-3 flex items-center gap-3 shadow-lg">
<span class="material-symbols-outlined text-[#8E8E93] text-[20px]" data-icon="search">search</span>
<input aria-label="Tìm kiếm địa điểm" class="w-full bg-transparent border-0 p-0 text-[15px] font-medium text-white placeholder-[#8E8E93] focus:outline-none focus:ring-0" placeholder="Tìm địa điểm" type="text"/>
</div>
</div>
<!-- 5. FLOATING ACTION CONTROLS (Bottom Right) -->
<div class="absolute bottom-24 right-4 z-40 flex flex-col items-center">
<!-- Recenter / My Location Button -->
<button aria-label="Định vị của tôi" class="w-11 h-11 rounded-full backdrop-blur-md bg-[#1A1A1D]/90 border border-white/10 text-white shadow-lg flex items-center justify-center mb-3 active:scale-90 transition-transform duration-150 focus:outline-none" type="button">
<span class="material-symbols-outlined text-[21px]" data-icon="my_location">my_location</span>
</button>
<!-- Primary Action FAB: Add Place ('+') - Coral #F26A3D -->
<button aria-label="Thêm địa điểm" class="w-14 h-14 rounded-full bg-[#F26A3D] text-white shadow-[0_8px_25px_rgba(242,106,61,0.5)] flex items-center justify-center hover:scale-105 active:scale-95 transition-transform duration-150 focus:outline-none" type="button">
<span class="material-symbols-outlined text-[30px] font-normal" data-icon="add">add</span>
</button>
</div>
<!-- 6. BOTTOM NAVIGATION BAR (Shared Components JSON Anchor & Strict Locket Rule) -->
<!-- Floating slim pill bar at bottom, icons only, 5 icons in fixed order: 1 Bản đồ, 2 Địa điểm, 3 Dòng thời gian, 4 Nhật ký, 5 Cá nhân -->
<nav aria-label="Điều hướng chính" class="fixed bottom-6 inset-x-0 mx-auto w-fit z-50 flex items-center justify-center gap-7 px-6 py-3.5 rounded-full backdrop-blur-xl bg-[#1A1A1D]/90 border border-neutral-800/60 shadow-2xl shadow-black/80">
<!-- 1. Bản đồ (Map) - ACTIVE: text-white with tiny coral #F26A3D dot underneath -->
<button aria-label="Bản đồ" class="relative flex flex-col items-center justify-center text-white after:content-[''] after:w-1 after:h-1 after:bg-[#F26A3D] after:rounded-full after:absolute after:-bottom-1.5 active:scale-90 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="map">map</span>
</button>
<!-- 2. Địa điểm (format_list_bulleted / Place list) - Inactive #8E8E93 -->
<button aria-label="Địa điểm" class="flex flex-col items-center justify-center text-[#8E8E93] hover:text-white transition-colors duration-150 active:scale-90" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="format_list_bulleted">format_list_bulleted</span>
</button>
<!-- 3. Dòng thời gian (schedule / Timeline) - Inactive #8E8E93 -->
<button aria-label="Dòng thời gian" class="flex flex-col items-center justify-center text-[#8E8E93] hover:text-white transition-colors duration-150 active:scale-90" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="schedule">schedule</span>
</button>
<!-- 4. Nhật ký (menu_book / Journal) - Inactive #8E8E93 -->
<button aria-label="Nhật ký" class="flex flex-col items-center justify-center text-[#8E8E93] hover:text-white transition-colors duration-150 active:scale-90" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="menu_book">menu_book</span>
</button>
<!-- 5. Cá nhân (person / Profile) - Inactive #8E8E93 -->
<button aria-label="Cá nhân" class="flex flex-col items-center justify-center text-[#8E8E93] hover:text-white transition-colors duration-150 active:scale-90" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="person">person</span>
</button>
</nav>
<!-- 7. iOS Home Indicator -->
<div class="absolute bottom-1 inset-x-0 z-50 flex justify-center pointer-events-none">
<div class="w-32 h-1 bg-white/25 rounded-full"></div>
</div>
</main>
</body></html>
