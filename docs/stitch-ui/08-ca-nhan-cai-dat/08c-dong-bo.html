<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Đồng bộ &amp; quyền</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Inter font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {},
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    body {
      background-color: #0E0E10;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#0E0E10] min-h-screen flex justify-center items-start text-white">
<!-- Screen Container (iOS Standard 390x844 Frame context, full-bleed design) -->
<div class="w-full max-w-[390px] min-h-[844px] h-screen flex flex-col justify-between relative bg-[#0E0E10] overflow-hidden px-5 pt-3 pb-2">
<!-- Top Area: Status Bar & Navigation -->
<div class="w-full flex flex-col">
<!-- iOS Status Bar (390 standard) -->
<div class="w-full h-11 flex justify-between items-center text-white text-[15px] font-semibold tracking-tight px-1 select-none">
<span>9:41</span>
<div class="flex items-center space-x-1.5 text-white">
<!-- Cellular Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="3.5" rx="0.5" width="2.5" x="0" y="8.5"></rect>
<rect height="6" rx="0.5" width="2.5" x="4.5" y="6"></rect>
<rect height="9" rx="0.5" width="2.5" x="9" y="3"></rect>
<rect height="11.5" rx="0.5" width="2.5" x="13.5" y="0.5"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8c2.9 0 5.6 1.1 7.6 3l-1.4 1.4C12.6 5.6 10.4 4.7 8 4.7s-4.6.9-6.2 2.5L0.4 5.8C2.4 3.9 5.1 2.8 8 2.8zm0 4c1.8 0 3.4.7 4.7 2L8 12 3.3 8.8c1.3-1.3 2.9-2 4.7-2z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-5 h-2.5 rounded-[4px] border border-white/70 p-[1.5px] flex items-center">
<div class="w-full h-full bg-white rounded-[1.5px]"></div>
</div>
<div class="w-[1.5px] h-1 bg-white/70 rounded-r-sm ml-[1px]"></div>
</div>
</div>
</div>
<!-- Top Bar: Back Chevron & Title -->
<div class="flex items-center space-x-3 mt-1 py-2">
<button class="w-10 h-10 rounded-full bg-[#1A1A1D] flex items-center justify-center text-white active:scale-95 transition-transform" onclick="history.back()">
<span class="material-symbols-outlined text-[20px] pr-0.5">arrow_back_ios_new</span>
</button>
<h1 class="text-[28px] font-bold tracking-tight text-white font-headline">Đồng bộ</h1>
</div>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col pt-3 space-y-6">
<!-- Sync Status Main Card -->
<div class="w-full bg-[#1A1A1D] rounded-[24px] p-5 flex flex-col border border-white/5 shadow-lg">
<div class="flex items-start justify-between">
<div class="flex items-start space-x-3.5">
<!-- Cloud alert icon with coral accent -->
<div class="relative w-11 h-11 rounded-2xl bg-[#0E0E10] flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-white text-[24px]">cloud_sync</span>
<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-[#F26A3D] ring-2 ring-[#0E0E10]"></span>
</div>
<div class="flex flex-col pt-0.5">
<h2 class="text-[17px] font-bold text-white leading-tight font-headline">2 thay đổi chưa đồng bộ</h2>
<span class="text-[13px] text-[#8E8E93] mt-1 font-body">Lần cuối: 10:41</span>
</div>
</div>
</div>
<div class="mt-4 pt-3 flex justify-end border-t border-white/5">
<button class="bg-[#F26A3D] text-white text-[14px] font-semibold px-5 py-2 rounded-full active:scale-95 transition-transform flex items-center space-x-1.5 shadow-sm" id="retry-btn">
<span>Thử lại</span>
</button>
</div>
</div>
<!-- Pending Changes List Section -->
<div class="flex flex-col">
<div class="w-full bg-[#1A1A1D] rounded-[24px] overflow-hidden border border-white/5">
<!-- Row 1 -->
<div class="flex items-center justify-between px-5 py-4 border-b border-white/5 active:bg-white/[0.02] transition-colors">
<div class="flex flex-col pr-3 min-w-0">
<span class="text-[15px] font-medium text-white truncate font-body">Bánh mì 25 · Địa điểm mới</span>
</div>
<div class="flex-shrink-0">
<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[12px] font-medium bg-white/5 text-[#8E8E93]">
                Đang chờ
              </span>
</div>
</div>
<!-- Row 2 -->
<div class="flex items-center justify-between px-5 py-4 active:bg-white/[0.02] transition-colors">
<div class="flex flex-col pr-3 min-w-0">
<span class="text-[15px] font-medium text-white truncate font-body">Lần ghé · Hồ Tây</span>
</div>
<div class="flex-shrink-0">
<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[12px] font-medium bg-[#F26A3D]/10 text-[#F26A3D]">
                Lỗi – thử lại
              </span>
</div>
</div>
</div>
</div>
<!-- Permissions Section -->
<div class="flex flex-col pt-1">
<span class="text-[13px] font-medium text-[#8E8E93] mb-2 px-1 font-headline">Quyền truy cập</span>
<div class="w-full bg-[#1A1A1D] rounded-[24px] overflow-hidden border border-white/5 divide-y divide-white/5">
<!-- Location Permission Row -->
<div class="flex items-center justify-between px-5 py-4 active:bg-white/[0.02] transition-colors cursor-pointer">
<div class="flex items-center space-x-3.5">
<span class="material-symbols-outlined text-[20px] text-white">near_me</span>
<span class="text-[15px] font-medium text-white font-body">Vị trí</span>
</div>
<div class="flex items-center space-x-1.5">
<span class="text-[14px] text-[#8E8E93] font-body">Khi dùng app</span>
<span class="material-symbols-outlined text-[18px] text-[#8E8E93]/70">chevron_right</span>
</div>
</div>
<!-- Photos Permission Row -->
<div class="flex items-center justify-between px-5 py-4 active:bg-white/[0.02] transition-colors cursor-pointer">
<div class="flex items-center space-x-3.5">
<span class="material-symbols-outlined text-[20px] text-white">photo_library</span>
<span class="text-[15px] font-medium text-white font-body">Ảnh</span>
</div>
<div class="flex items-center space-x-1.5">
<span class="text-[14px] text-[#8E8E93] font-body">Đã chọn ảnh</span>
<span class="material-symbols-outlined text-[18px] text-[#8E8E93]/70">chevron_right</span>
</div>
</div>
</div>
</div>
</div>
<!-- Bottom Area: iOS Home Indicator Safe Area (No BottomNavBar on sub-screens) -->
<div class="w-full pb-2 pt-4 flex justify-center items-center pointer-events-none">
<div class="w-32 h-1 bg-white/25 rounded-full"></div>
</div>
</div>
<script>
    // Micro-interaction for 'Thử lại' button
    const retryBtn = document.getElementById('retry-btn');
    if (retryBtn) {
      retryBtn.addEventListener('click', function() {
        const originalText = retryBtn.innerHTML;
        retryBtn.innerHTML = `
          <svg class="animate-spin -ml-0.5 mr-1.5 h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Đang đồng bộ...</span>
        `;
        retryBtn.disabled = true;
        retryBtn.classList.add('opacity-80');
        setTimeout(() => {
          retryBtn.innerHTML = `<span>Thử lại</span>`;
          retryBtn.disabled = false;
          retryBtn.classList.remove('opacity-80');
        }, 1500);
      });
    }
  </script>
</body></html>
