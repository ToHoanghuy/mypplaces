<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Sửa hồ sơ</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Inter font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            app: {
              bg: "#0E0E10",
              surface: "#1A1A1D",
              coral: "#F26A3D",
              text: "#FFFFFF",
              secondary: "#8E8E93"
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #0E0E10;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    input:focus {
      outline: none;
    }
  </style>
</head>
<body class="bg-[#0E0E10] text-white antialiased flex items-center justify-center min-h-screen sm:p-4">
<!-- iPhone 15 / 390x844 Screen Wrapper -->
<div class="w-full max-w-[390px] h-[844px] bg-[#0E0E10] relative flex flex-col justify-between overflow-hidden sm:rounded-[48px] sm:ring-1 sm:ring-white/10 shadow-2xl">
<!-- Top Area: iOS Status Bar & Header -->
<div class="w-full pt-3 px-6 select-none z-10">
<!-- iOS Status Bar -->
<div class="flex justify-between items-center text-xs tracking-tight text-white font-medium h-8 pt-1">
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<div class="flex items-center gap-1.5 text-white">
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[20px] leading-none" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- Top Bar: Cancel | Title | Save -->
<header class="flex justify-between items-center h-14 mt-1">
<!-- Hủy Button -->
<button class="text-[16px] text-[#8E8E93] hover:text-white transition-colors active:scale-95 duration-150 py-1 font-normal tracking-tight" type="button">
          Hủy
        </button>
<!-- Tiêu đề nhỏ tinh gọn -->
<h1 class="text-[17px] font-semibold text-white tracking-tight">
          Hồ sơ
        </h1>
<!-- Lưu Button: Pill coral nổi bật -->
<button class="bg-[#F26A3D] text-white text-[14px] font-medium px-4 py-1.5 rounded-full active:scale-95 transition-transform duration-150 shadow-sm shadow-[#F26A3D]/20" type="button">
          Lưu
        </button>
</header>
</div>
<!-- Main Content Area: Centered Avatar + Forms -->
<main class="flex-1 flex flex-col items-center justify-start px-6 pt-6 pb-2">
<!-- Central Avatar Section -->
<div class="flex flex-col items-center mt-3 mb-10">
<div class="relative group cursor-pointer active:scale-95 transition-transform duration-150">
<!-- Big Circular Avatar -->
<div class="w-32 h-32 rounded-full overflow-hidden ring-2 ring-white/10 shadow-xl bg-[#1A1A1D]">
<img alt="Ảnh đại diện của Tô Huy" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrOB-mvlTv1tyt_RAWBgBk6LaFifZH_3dyLMOcL5XOV5LoyvqURNdH7iNdpRumrSVcKFEn7P2b5LnCtwGpSeimaFz_2RLotvMD0pMwkf5SoAhZCZyBMrLsepAQbYDceYQtvZT1TU3x0iTuEEeJbr6Q55A3nGPMzQj-edQIELEL3VrOj-xPfYrFU2SSPyh_ybvuXWOZPKT5y5l_dh3uwKT-JnUwEr-p0FFeT476HSfVHCn4nq22_Tm776iDI-SRMLB5Ft3cbQSHZl6g"/>
</div>
<!-- Camera Badge Button -->
<button aria-label="Chụp hoặc đổi ảnh" class="absolute bottom-0 right-0 w-10 h-10 rounded-full bg-[#1A1A1D] border-2 border-[#0E0E10] flex items-center justify-center text-white active:scale-90 transition-transform shadow-lg" type="button">
<span class="material-symbols-outlined text-[19px] leading-none text-white/90" data-icon="photo_camera">photo_camera</span>
</button>
</div>
<!-- 'Đổi ảnh' text button -->
<button class="mt-3.5 text-[14px] font-medium text-[#8E8E93] hover:text-white transition-colors duration-150 active:scale-95" type="button">
          Đổi ảnh
        </button>
</div>
<!-- Minimal Form Fields -->
<div class="w-full flex flex-col gap-4">
<!-- Field 1: Tên hiển thị (Editable Pill) -->
<div class="w-full bg-[#1A1A1D] rounded-full px-5 py-3.5 flex items-center justify-between border border-white/[0.04] focus-within:border-white/20 transition-all duration-200">
<div class="flex-1 flex flex-col justify-center pr-2">
<label class="text-[11px] font-medium text-[#8E8E93] tracking-wide mb-0.5" for="display-name">
              Tên hiển thị
            </label>
<input autocomplete="name" class="w-full bg-transparent p-0 border-0 text-[16px] text-white font-medium focus:ring-0 placeholder-[#8E8E93] leading-none" id="display-name" maxlength="40" placeholder="Nhập tên" type="text" value="Tô Huy"/>
</div>
<span class="text-[12px] font-medium text-[#8E8E93] select-none pl-2">
            6/40
          </span>
</div>
<!-- Field 2: Email (Disabled / Readonly Pill) -->
<div class="w-full bg-[#1A1A1D]/60 rounded-full px-5 py-3.5 flex items-center justify-between border border-white/[0.02] opacity-80 cursor-not-allowed">
<div class="flex-1 flex flex-col justify-center pr-2">
<span class="text-[11px] font-medium text-[#8E8E93] tracking-wide mb-0.5">
              Email
            </span>
<input class="w-full bg-transparent p-0 border-0 text-[15px] text-white/70 font-medium focus:ring-0 cursor-not-allowed leading-none" disabled="" readonly="" type="text" value="huy@gmail.com"/>
</div>
<div class="flex items-center text-[#8E8E93] select-none pl-2">
<span class="material-symbols-outlined text-[17px] leading-none text-[#8E8E93]" data-icon="lock">lock</span>
</div>
</div>
</div>
</main>
<!-- Bottom Safe Area: iOS Home Indicator (Sub-screens have NO BottomNavBar) -->
<footer class="w-full pb-3 pt-4 flex flex-col items-center justify-center select-none">
<div class="w-36 h-1 bg-white/25 rounded-full mb-1"></div>
</footer>
</div>
<script>
    // Minimal dynamic character counter
    const nameInput = document.getElementById('display-name');
    const counter = nameInput ? nameInput.parentElement.nextElementSibling : null;

    if (nameInput && counter) {
      nameInput.addEventListener('input', () => {
        const currentLen = nameInput.value.length;
        counter.textContent = `${currentLen}/40`;
      });
    }
  </script>
</body></html>
